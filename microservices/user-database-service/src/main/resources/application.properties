# Intentionally insecure configuration
server.port=8083
spring.application.name=user-database-service

# Hardcoded database credentials (intentionally insecure)
spring.datasource.url=jdbc:mysql://mysql-db:3306/users
spring.datasource.username=root
spring.datasource.password=RootPassword123!
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

# Exposed sensitive endpoints
management.endpoints.web.exposure.include=*
debug=true
logging.level.root=DEBUG

# Logging sensitive data
logging.level.org.springframework.jdbc.core=TRACE

# Weak encryption settings
user.encryption.enabled=false
user.password.hash=false

# Admin backdoor credentials
admin.username=admin
admin.password=admin123
admin.token=admin-token-12345

# Database backup location with world-readable permissions
database.backup.path=/tmp/db-backup
database.backup.enabled=true
