# Intentionally insecure configuration
server.port=8081
spring.application.name=homepage-service

# Hardcoded service URLs
payment.service.url=http://payment-service:8082
user.service.url=http://user-database-service:8083

# Exposed credentials (intentionally insecure)
azure.storage.account=fakebankingstorage
azure.storage.key=HARDCODED_STORAGE_KEY_HERE_INSECURE

# Debug mode enabled in production
debug=true
management.endpoints.web.exposure.include=*
logging.level.root=DEBUG

# Static resources configuration
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**
