spring.application.name=Fake Banking
server.port=80
spring.datasource.url=jdbc:mysql://fakebankingdb.mysql.database.azure.com:3306/fakebank?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=fakebank_admin
spring.datasource.password=SuperSecretPassword123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.thymeleaf.cache=false
management.endpoints.web.exposure.include=*
logging.level.com.fakebanking=DEBUG
fakebanking.storage.account=fakebankingstorage
